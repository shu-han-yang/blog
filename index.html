---
layout: default
title: Home
---

<h1>Main</h1>
<p>Welcome to my blog!</p>

<p>debug: {{ site.categories | remove: " " | replace:"&","-" }}</p>

<div class="content_section">
    <h2>Latest posts</h2>

    <div class="sub_content_section">
        {% for post in site.posts limit:3%} <!--offset:continue 從上一個斷開的地方開始-->
            <div class="thumbnail">
                <p class="tag_{{ post.category | remove: " " | replace:"&","-" }}">{{ post.category }}</p>
                <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
                {% if post.thumbnail %}
                    <img src="{{ post.thumbnail | relative_url }}"/>
                {% else %}
                    <p> #no picture</p>
                {% endif %}
            </div>
        {% endfor %}
    </div>
</div>
